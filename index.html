<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas Personales — Oswaldo Gallardo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0eeea;
      --border: rgba(0,0,0,0.10);
      --border-md: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #9e9e9a;
      --radius-md: 8px;
      --radius-lg: 12px;
      --green: #1D9E75;
      --amber: #BA7517;
      --red: #E24B4A;
      --green-bg: #E1F5EE;
      --red-bg: #FCEBEB;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.10);
        --border-md: rgba(255,255,255,0.18);
        --text: #f0eeea;
        --text2: #a0a09c;
        --text3: #6b6b67;
        --green-bg: #04342C;
        --red-bg: #501313;
      }
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 24px 0 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
    }

    .mes-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
    }

    .mes-nav {
      background: none;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 18px;
      color: var(--text2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .mes-nav:hover { background: var(--surface2); }

    .mes-label {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .tabs {
      display: flex;
      gap: 2px;
      background: var(--surface2);
      border-radius: var(--radius-lg);
      padding: 3px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab.active {
      background: var(--surface);
      color: var(--text);
      border: 0.5px solid var(--border);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 100px;
    }

    label {
      font-size: 12px;
      color: var(--text2);
    }

    input, select {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--surface);
      color: var(--text);
      width: 100%;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--text2);
    }

    .btn {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--surface2); }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn-primary:hover { opacity: 0.85; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .metric-value.green { color: var(--green); }
    .metric-value.red { color: var(--red); }
    .metric-value.amber { color: var(--amber); }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .hist-item:last-child { border-bottom: none; }

    .hist-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .hist-info { flex: 1; min-width: 0; }

    .hist-desc {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .hist-amount {
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      flex-shrink: 0;
    }

    .hist-del {
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 18px;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
    }

    .hist-del:hover { color: var(--red); }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bar-cat {
      font-size: 12px;
      color: var(--text);
      width: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bar-bg {
      flex: 1;
      height: 7px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-pct {
      font-size: 11px;
      color: var(--text2);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .sem-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-btn {
      padding: 5px 12px;
      font-size: 12px;
      border: 0.5px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .ingreso-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border);
    }

    .ingreso-row:last-child { border-bottom: none; }
    .ingreso-amount { font-size: 13px; font-weight: 600; color: var(--green); flex-shrink: 0; }

    .empty {
      font-size: 13px;
      color: var(--text3);
      padding: 24px 0;
      text-align: center;
    }

    .msg-ok {
      font-size: 13px;
      color: var(--green);
      padding: 6px 0;
      display: none;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0 0;
      margin-top: 4px;
      border-top: 0.5px solid var(--border);
      font-size: 12px;
      color: var(--text2);
    }

    .total-row b { color: var(--text); }

    @media (max-width: 400px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Finanzas Personales</h1>
      <p>Oswaldo Gallardo — G&V / INSTA</p>
    </header>

    <div class="mes-selector">
      <button class="mes-nav" onclick="cambiarMes(-1)">‹</button>
      <div class="mes-label" id="mes-label"></div>
      <button class="mes-nav" onclick="cambiarMes(1)">›</button>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('registrar')">+ Registrar</button>
      <button class="tab" onclick="showTab('historial')">Historial</button>
      <button class="tab" onclick="showTab('resumen')">Resumen</button>
    </div>

    <!-- PANEL REGISTRAR -->
    <div class="panel active" id="panel-registrar">
      <div class="section-title">Nuevo gasto</div>
      <div class="card">
        <div class="form-row">
          <div class="form-group" style="flex:1.2">
            <label>Fecha</label>
            <input type="date" id="inp-fecha">
          </div>
          <div class="form-group" style="flex:1.5">
            <label>Categoría</label>
            <select id="inp-cat">
              <option value="transporte">🚗 Transporte</option>
              <option value="gym">💪 Gym</option>
              <option value="comida">🍽️ Comida</option>
              <option value="compras">🛍️ Compras</option>
              <option value="ahorro">💰 Ahorro</option>
              <option value="salud">🏥 Salud</option>
              <option value="emergencias">⚡ Emergencias</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>Descripción</label>
            <input type="text" id="inp-desc" placeholder="Ej: Almuerzo, bus, farmacia…">
          </div>
          <div class="form-group" style="flex:1">
            <label>Monto ($)</label>
            <input type="number" id="inp-monto" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <button class="btn btn-primary" onclick="agregarGasto()">Agregar gasto</button>
        <div class="msg-ok" id="msg-ok">✓ Registrado correctamente</div>
      </div>

      <div class="section-title">Ingresos del mes</div>
      <div class="card">
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>Descripción</label>
            <input type="text" id="inp-ing-desc" placeholder="Ej: Honorarios INSTA, G&V…">
          </div>
          <div class="form-group" style="flex:1">
            <label>Monto ($)</label>
            <input type="number" id="inp-ing-monto" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <button class="btn" onclick="agregarIngreso()">Agregar ingreso</button>
        <div id="ing-lista"></div>
      </div>
    </div>

    <!-- PANEL HISTORIAL -->
    <div class="panel" id="panel-historial">
      <div class="filter-row" id="filtros"></div>
      <div class="card" style="padding:10px 14px">
        <div id="hist-lista"><div class="empty">Sin movimientos este mes</div></div>
      </div>
    </div>

    <!-- PANEL RESUMEN -->
    <div class="panel" id="panel-resumen">
      <div class="metrics" id="metrics-wrap"></div>
      <div class="section-title">Distribución por categoría</div>
      <div class="card">
        <div id="bars-wrap"></div>
      </div>
    </div>
  </div>

  <script>
    const CATS = {
      transporte: { label: 'Transporte', icon: '🚗', max: 15 },
      gym:        { label: 'Gym',        icon: '💪', max: 5  },
      comida:     { label: 'Comida',     icon: '🍽️', max: 25 },
      compras:    { label: 'Compras',    icon: '🛍️', max: 10 },
      ahorro:     { label: 'Ahorro',     icon: '💰', min: 20 },
      salud:      { label: 'Salud',      icon: '🏥', max: 10 },
      emergencias:{ label: 'Emergencias',icon: '⚡', max: 5  }
    };

    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    let now = new Date();
    let curYear = now.getFullYear();
    let curMonth = now.getMonth();
    let filterCat = 'todos';
    let allData = { gastos: [], ingresos: [] };

    function storageKey(y, m) { return `finanzas_og_${y}_${m}`; }

    function loadData() {
      const k = storageKey(curYear, curMonth);
      try {
        const raw = localStorage.getItem(k);
        allData = raw ? JSON.parse(raw) : { gastos: [], ingresos: [] };
        if (!allData.ingresos) allData.ingresos = [];
      } catch(e) {
        allData = { gastos: [], ingresos: [] };
      }
    }

    function saveData() {
      try {
        localStorage.setItem(storageKey(curYear, curMonth), JSON.stringify(allData));
      } catch(e) {}
    }

    function cambiarMes(d) {
      curMonth += d;
      if (curMonth > 11) { curMonth = 0; curYear++; }
      if (curMonth < 0)  { curMonth = 11; curYear--; }
      filterCat = 'todos';
      loadData();
      render();
    }

    function showTab(t) {
      ['registrar','historial','resumen'].forEach((name, i) => {
        document.querySelectorAll('.tab')[i].classList.toggle('active', name === t);
        document.getElementById('panel-' + name).classList.toggle('active', name === t);
      });
      render();
    }

    function agregarGasto() {
      const fecha = document.getElementById('inp-fecha').value;
      const cat   = document.getElementById('inp-cat').value;
      const desc  = document.getElementById('inp-desc').value.trim();
      const monto = parseFloat(document.getElementById('inp-monto').value);
      if (!fecha || !desc || isNaN(monto) || monto <= 0) return;
      allData.gastos.push({ id: Date.now(), fecha, cat, desc, monto });
      allData.gastos.sort((a, b) => b.fecha.localeCompare(a.fecha));
      saveData();
      document.getElementById('inp-desc').value = '';
      document.getElementById('inp-monto').value = '';
      const msg = document.getElementById('msg-ok');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 1800);
      render();
    }

    function agregarIngreso() {
      const desc  = document.getElementById('inp-ing-desc').value.trim();
      const monto = parseFloat(document.getElementById('inp-ing-monto').value);
      if (!desc || isNaN(monto) || monto <= 0) return;
      allData.ingresos.push({ id: Date.now(), desc, monto });
      saveData();
      document.getElementById('inp-ing-desc').value = '';
      document.getElementById('inp-ing-monto').value = '';
      render();
    }

    function eliminarGasto(id) {
      allData.gastos = allData.gastos.filter(g => g.id !== id);
      saveData(); render();
    }

    function eliminarIngreso(id) {
      allData.ingresos = allData.ingresos.filter(i => i.id !== id);
      saveData(); render();
    }

    function totalIngresos() {
      return (allData.ingresos || []).reduce((s, i) => s + i.monto, 0);
    }

    function formatFecha(fechaISO) {
      const [anio, mes, dia] = fechaISO.split('-');
      return `${dia}/${mes}/${anio}`;
    }

    function semColor(cat, pct) {
      const c = CATS[cat];
      if (!c) return '#888780';
      if (c.min) return pct >= c.min ? '#1D9E75' : pct >= c.min / 2 ? '#EF9F27' : '#E24B4A';
      if (pct <= c.max * 0.85) return '#1D9E75';
      if (pct <= c.max) return '#EF9F27';
      return '#E24B4A';
    }

    function render() {
      document.getElementById('mes-label').textContent = `${MESES[curMonth]} ${curYear}`;
      renderIngresos();
      renderFiltros();
      renderHistorial();
      renderResumen();
    }

    function renderIngresos() {
      const lista = document.getElementById('ing-lista');
      const ings  = allData.ingresos || [];
      if (ings.length === 0) { lista.innerHTML = ''; return; }
      lista.innerHTML = '<div style="border-top:0.5px solid var(--border);margin-top:10px;padding-top:6px">' +
        ings.map(i => `
          <div class="ingreso-row">
            <div style="flex:1;font-size:13px;color:var(--text)">${i.desc}</div>
            <div class="ingreso-amount">+$${i.monto.toFixed(2)}</div>
            <button class="hist-del" onclick="eliminarIngreso(${i.id})">×</button>
          </div>`).join('') +
        `<div class="total-row"><span>Total ingresos</span><b>$${totalIngresos().toFixed(2)}</b></div>` +
        '</div>';
    }

    function renderFiltros() {
      const cats = ['todos', ...Object.keys(CATS)];
      document.getElementById('filtros').innerHTML = cats.map(c => `
        <button class="filter-btn ${filterCat === c ? 'active' : ''}" onclick="setFilter('${c}')">
          ${c === 'todos' ? 'Todos' : CATS[c].icon + ' ' + CATS[c].label}
        </button>`).join('');
    }

    function setFilter(c) { filterCat = c; renderFiltros(); renderHistorial(); }

    function renderHistorial() {
      const gastos   = allData.gastos || [];
      const filtered = filterCat === 'todos' ? gastos : gastos.filter(g => g.cat === filterCat);
      const lista    = document.getElementById('hist-lista');
      if (filtered.length === 0) {
        lista.innerHTML = `<div class="empty">Sin movimientos${filterCat !== 'todos' ? ' en esta categoría' : ' este mes'}</div>`;
        return;
      }
      lista.innerHTML = filtered.map(g => {
        return `<div class="hist-item">
          <div class="hist-icon">${CATS[g.cat] ? CATS[g.cat].icon : '?'}</div>
          <div class="hist-info">
            <div class="hist-desc">${g.desc}</div>
            <div class="hist-meta">${formatFecha(g.fecha)} · ${CATS[g.cat] ? CATS[g.cat].label : g.cat}</div>
          </div>
          <div class="hist-amount">-$${g.monto.toFixed(2)}</div>
          <button class="hist-del" title="Eliminar" onclick="eliminarGasto(${g.id})">×</button>
        </div>`;
      }).join('');
    }

    function renderResumen() {
      const gastos     = allData.gastos || [];
      const ingreso    = totalIngresos();
      const totalGasto = gastos.reduce((s, g) => s + g.monto, 0);
      const balance    = ingreso - totalGasto;
      const ahorroEf   = ingreso > 0 ? (balance / ingreso) * 100 : 0;

      document.getElementById('metrics-wrap').innerHTML = `
        <div class="metric">
          <div class="metric-label">Ingresos</div>
          <div class="metric-value">$${ingreso.toFixed(2)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Egresos</div>
          <div class="metric-value ${totalGasto > ingreso ? 'red' : ''}">$${totalGasto.toFixed(2)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Balance neto</div>
          <div class="metric-value ${balance >= 0 ? 'green' : 'red'}">${balance >= 0 ? '+' : ''}$${balance.toFixed(2)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Ahorro efectivo</div>
          <div class="metric-value ${ahorroEf >= 20 ? 'green' : ahorroEf >= 10 ? 'amber' : 'red'}">${ahorroEf.toFixed(1)}%</div>
        </div>
      `;

      const por = {};
      Object.keys(CATS).forEach(k => por[k] = 0);
      gastos.forEach(g => { if (por[g.cat] !== undefined) por[g.cat] += g.monto; });

      document.getElementById('bars-wrap').innerHTML = Object.keys(CATS).map(k => {
        const v    = por[k] || 0;
        const pct  = ingreso > 0 ? (v / ingreso) * 100 : 0;
        const col  = semColor(k, pct);
        const barW = Math.min(pct * 3.5, 100);
        const ideal = CATS[k].min ? `≥${CATS[k].min}%` : `≤${CATS[k].max}%`;
        return `<div class="bar-row">
          <div class="bar-cat"><span>${CATS[k].icon}</span>${CATS[k].label}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barW}%;background:${col}"></div></div>
          <span class="bar-pct">${pct.toFixed(1)}%</span>
          <div class="sem-dot" style="background:${col}" title="Ideal: ${ideal}"></div>
        </div>`;
      }).join('');
    }

    // Init
    document.getElementById('inp-fecha').value = new Date().toISOString().split('T')[0];
    loadData();
    render();
  </script>
</body>
</html>
